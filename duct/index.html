  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {

  }

  ) {

    left: 50%;

  }

  .form-check-label {

  &lt;div class=&quot;cad-stage&quot; role=&quot;img&quot; aria-label=&quot;Exact equal-scale three-dimensional exhaust model inside a room with twenty centimetre perimeter walls and roof slab, a shaft enclosure extending to Z 762, a one hundred centimetre GRC enclosure rising from the shaft opening, an oversized glass roof, a recessed downlight, five formed 90-degree elbows, and a tapered rain hood outlet.&quot;&gt;&lt;/div&gt;

&lt;style&gt;

&lt;script type=&quot;importmap&quot;&gt;
{
  &quot;imports&quot;: {
    &quot;three&quot;: &quot;https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js&quot;,
    &quot;three/addons/&quot;: &quot;https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/&quot;
  }
}
&lt;/script&gt;

&lt;script type=&quot;module&quot;&gt;
  import * as THREE from &quot;three&quot;;
  import { OrbitControls } from &quot;three/addons/controls/OrbitControls.js&quot;;

  const root = document.getElementById(&quot;duct-option-b-rebuild&quot;);
  const stage = root.querySelector(&quot;.cad-stage&quot;);
  const colorProbe = document.createElement(&quot;span&quot;);
  colorProbe.style.cssText = &quot;position:absolute;visibility:hidden;pointer-events:none&quot;;
  root.appendChild(colorProbe);
  const colorFallback = {
    &quot;--viz-series-1&quot;: &quot;--yellow&quot;,
    &quot;--viz-series-2&quot;: &quot;--blue&quot;,
    &quot;--viz-series-3&quot;: &quot;--green&quot;,
    &quot;--viz-series-4&quot;: &quot;--purple&quot;,
    &quot;--viz-series-5&quot;: &quot;--orange&quot;,
    &quot;--viz-series-6&quot;: &quot;--red&quot;
  };
  const theme = name =&gt; {
    const fallback = colorFallback[name] || &quot;--foreground&quot;;
    colorProbe.style.color = `var(${name}, var(${fallback}))`;
    return getComputedStyle(colorProbe).color;
  };

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 1, 3000);
  camera.up.set(0, 1, 0);
  camera.position.set(-820, 865, 760);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(theme(&quot;--background&quot;), theme(&quot;--muted&quot;), 2.1));
  const keyLight = new THREE.DirectionalLight(theme(&quot;--foreground&quot;), 2.4);
  keyLight.position.set(-160, 260, 220);
  scene.add(keyLight);

  // CAD coordinates: +X right, +Y back, +Z up. The wall bottom is Z=0;
  // legacy component values are shifted upward 175 cm from the hood datum.
  const zDatumShift = 175;
  const world = (x, y, z) =&gt; new THREE.Vector3(x, z + zDatumShift, -y);

  function lineSegments(points, color, opacity) {
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ color, transparent: opacity &lt; 1, opacity });
    const lines = new THREE.LineSegments(geometry, material);
    scene.add(lines);
    return lines;
  }

  const minorGrid = [];
  const majorGrid = [];
  for (let x = -20; x &lt;= 200; x += 10) {
    const bucket = x % 50 === 0 ? majorGrid : minorGrid;
    bucket.push(world(x, -40, -175), world(x, 320, -175));
  }
  for (let y = -40; y &lt;= 320; y += 10) {
    const bucket = y % 50 === 0 ? majorGrid : minorGrid;
    bucket.push(world(-20, y, -175), world(200, y, -175));
  }
  for (let x = -20; x &lt;= 200; x += 10) {
    const bucket = x % 50 === 0 ? majorGrid : minorGrid;
    bucket.push(world(x, 300, -175), world(x, 300, 725));
  }
  for (let z = -175; z &lt;= 725; z += 10) {
    const bucket = (z + zDatumShift) % 50 === 0 ? majorGrid : minorGrid;
    bucket.push(world(0, 300, z), world(200, 300, z));
  }
  lineSegments(minorGrid, theme(&quot;--border&quot;), 0.28);
  lineSegments(majorGrid, theme(&quot;--muted-foreground&quot;), 0.5);

  lineSegments([world(0, -40, -175), world(210, -40, -175)], theme(&quot;--viz-series-1&quot;), 0.95);
  lineSegments([world(0, -40, -175), world(0, 325, -175)], theme(&quot;--viz-series-2&quot;), 0.95);
  lineSegments([world(0, -40, -175), world(0, -40, 725)], theme(&quot;--viz-series-3&quot;), 0.95);

  function addBox({ x, y, z, color, opacity = 0.72, edgeOpacity = 0.9 }) {
    const width = x[1] - x[0];
    const depth = y[1] - y[0];
    const height = z[1] - z[0];
    const geometry = new THREE.BoxGeometry(width, height, depth);
    const material = new THREE.MeshPhongMaterial({
      color: theme(color), transparent: true, opacity,
      side: THREE.DoubleSide, depthWrite: opacity &gt;= 0.3, shininess: 18
    });
    const position = world(
      (x[0] + x[1]) / 2,
      (y[0] + y[1]) / 2,
      (z[0] + z[1]) / 2
    );
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(position);
    scene.add(mesh);

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry),
      new THREE.LineBasicMaterial({
        color: theme(&quot;--foreground&quot;), transparent: true, opacity: edgeOpacity
      })
    );
    edges.position.copy(position);
    edges.renderOrder = 5;
    scene.add(edges);
  }

  function addVerticalCylinder({ radius, x, y, z, color, opacity = 0.7 }) {
    const height = z[1] - z[0];
    const geometry = new THREE.CylinderGeometry(radius, radius, height, 64, 1, false);
    const material = new THREE.MeshPhongMaterial({
      color: theme(color), transparent: true, opacity,
      side: THREE.DoubleSide, depthWrite: true, shininess: 20
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(world(x, y, (z[0] + z[1]) / 2));
    scene.add(mesh);
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry, 12),
      new THREE.LineBasicMaterial({
        color: theme(&quot;--foreground&quot;), transparent: true, opacity: 0.9
      })
    );
    edges.position.copy(mesh.position);
    edges.renderOrder = 8;
    scene.add(edges);
  }

  function addTaperedDepthBox({ x, frontY, bottomRearY, topRearY, z, color }) {
    const cadPoints = [
      [x[0], frontY, z[0]], [x[1], frontY, z[0]],
      [x[1], bottomRearY, z[0]], [x[0], bottomRearY, z[0]],
      [x[0], frontY, z[1]], [x[1], frontY, z[1]],
      [x[1], topRearY, z[1]], [x[0], topRearY, z[1]]
    ];
    const positions = cadPoints.flatMap(([px, py, pz]) =&gt; {
      const point = world(px, py, pz);
      return [point.x, point.y, point.z];
    });
    const indices = [
      0, 2, 1, 0, 3, 2,
      4, 5, 6, 4, 6, 7,
      0, 1, 5, 0, 5, 4,
      3, 7, 6, 3, 6, 2,
      0, 4, 7, 0, 7, 3,
      1, 2, 6, 1, 6, 5
    ];
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(&quot;position&quot;, new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    scene.add(new THREE.Mesh(
      geometry,
      new THREE.MeshPhongMaterial({
        color: theme(color), transparent: true, opacity: 0.72,
        side: THREE.DoubleSide, depthWrite: true, shininess: 18
      })
    ));
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry),
      new THREE.LineBasicMaterial({
        color: theme(&quot;--foreground&quot;), transparent: true, opacity: 0.9
      })
    );
    edges.renderOrder = 6;
    scene.add(edges);
  }

  function createSweptRectElbow(
    ringFactory,
    colorToken = &quot;--viz-series-3&quot;,
    extension = {}
  ) {
    const segments = 32;
    const rings = [];
    if (extension.before) rings.push(extension.before);
    for (let ring = 0; ring &lt;= segments; ring += 1) {
      const angle = (ring / segments) * Math.PI / 2;
      rings.push(ringFactory(angle));
    }
    if (extension.after) rings.push(extension.after);
    const positions = [];
    const indices = [];
    for (const section of rings) {
      for (const [x, y, z] of section) {
        const point = world(x, y, z);
        positions.push(point.x, point.y, point.z);
      }
    }
    for (let ring = 0; ring &lt; rings.length - 1; ring += 1) {
      for (let side = 0; side &lt; 4; side += 1) {
        const nextSide = (side + 1) % 4;
        const a = ring * 4 + side;
        const b = ring * 4 + nextSide;
        const c = (ring + 1) * 4 + side;
        const d = (ring + 1) * 4 + nextSide;
        indices.push(a, c, b, b, c, d);
      }
    }
    indices.push(0, 1, 2, 0, 2, 3);
    const end = (rings.length - 1) * 4;
    indices.push(end, end + 2, end + 1, end, end + 3, end + 2);
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(&quot;position&quot;, new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    scene.add(new THREE.Mesh(
      geometry,
      new THREE.MeshPhongMaterial({
        color: theme(colorToken), transparent: true, opacity: 0.72,
        side: THREE.DoubleSide, depthWrite: true, shininess: 18
      })
    ));
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry, 12),
      new THREE.LineBasicMaterial({
        color: theme(&quot;--foreground&quot;), transparent: true, opacity: 0.9
      })
    );
    edges.renderOrder = 7;
    scene.add(edges);
  }

  // Hollow horizontal elbow with constant 35 × 15 cm nominal section.
  // The 10 cm allocation behind the former tight bend becomes the throat
  // radius, producing a fabricable continuous curve instead of a sharp corner.
  function createHollowElbow2() {
    const innerRadius = 10;
    const outerRadius = 45;
    const thickness = 0.05; // 0.5 mm
    const bottomZ = 111.5;
    const topZ = 126.5;
    const centreX = 72.5;
    const centreY = 265;
    const outletX = 71;
    const segments = 48;
    const material = new THREE.MeshPhongMaterial({
      color: theme(&quot;--red&quot;), transparent: true, opacity: 0.76,
      side: THREE.DoubleSide, depthWrite: true, shininess: 20
    });

    function sectorSolid(z0, z1, r0, r1) {
      const positions = [];
      const indices = [];
      for (let i = 0; i &lt;= segments; i += 1) {
        const angle = (i / segments) * Math.PI / 2;
        for (const z of [z0, z1]) {
          for (const radius of [r0, r1]) {
            const point = world(
              centreX + radius * Math.cos(angle),
              centreY - radius * Math.sin(angle),
              z
            );
            positions.push(point.x, point.y, point.z);
          }
        }
      }
      // Continue the same four sheet surfaces into the integrated outlet stub.
      for (const z of [z0, z1]) {
        for (const radius of [r0, r1]) {
          const point = world(outletX, centreY - radius, z);
          positions.push(point.x, point.y, point.z);
        }
      }
      const stride = 4;
      const ringCount = segments + 2;
      for (let i = 0; i &lt; ringCount - 1; i += 1) {
        const q = i * stride;
        const n = (i + 1) * stride;
        indices.push(q, n, n + 2, q, n + 2, q + 2);
        indices.push(q + 1, q + 3, n + 3, q + 1, n + 3, n + 1);
        indices.push(q, q + 1, n + 1, q, n + 1, n);
        indices.push(q + 2, n + 2, n + 3, q + 2, n + 3, q + 3);
      }
      indices.push(0, 2, 3, 0, 3, 1);
      const end = (ringCount - 1) * stride;
      indices.push(end, end + 1, end + 3, end, end + 3, end + 2);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(&quot;position&quot;, new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      scene.add(new THREE.Mesh(geometry, material));
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry, 28),
        new THREE.LineBasicMaterial({
          color: theme(&quot;--foreground&quot;), transparent: true, opacity: 0.72
        })
      );
      edges.renderOrder = 7;
      scene.add(edges);
    }

    // Continuous outer and inner curved sheets.
    sectorSolid(bottomZ + thickness, topZ - thickness, outerRadius - thickness, outerRadius);
    sectorSolid(bottomZ + thickness, topZ - thickness, innerRadius, innerRadius + thickness);
    // Bottom and top side cheeks; these carry the fabrication seams.
    sectorSolid(bottomZ, bottomZ + thickness, innerRadius + thickness, outerRadius - thickness);
    sectorSolid(topZ - thickness, topZ, innerRadius + thickness, outerRadius - thickness);

    // One outline at the open outlet/joint; no line across the curved plates.
    const outletOutline = [
      world(outletX, 220, bottomZ), world(outletX, 255, bottomZ),
      world(outletX, 255, bottomZ), world(outletX, 255, topZ),
      world(outletX, 255, topZ), world(outletX, 220, topZ),
      world(outletX, 220, topZ), world(outletX, 220, bottomZ)
    ];
    const outline = lineSegments(outletOutline, theme(&quot;--foreground&quot;), 0.84);
    outline.renderOrder = 8;
  }

  // Hollow Elbow 3 uses the same constant-section construction as Elbow 2.
  // Its added 10 cm is absorbed by the larger front curve.
  function createHollowElbow3() {
    const innerRadius = 10;
    const outerRadius = 45;
    const thickness = 0.05; // 0.5 mm
    const bottomZ = 111.5;
    const topZ = 126.5;
    const centreX = 69.5;
    const centreY = 210;
    const inletX = 71;
    const segments = 48;
    const material = new THREE.MeshPhongMaterial({
      color: theme(&quot;--viz-series-3&quot;), transparent: true, opacity: 0.76,
      side: THREE.DoubleSide, depthWrite: true, shininess: 20
    });

    function sectorSolid(z0, z1, r0, r1) {
      const positions = [];
      const indices = [];
      // Begin with the integrated inlet stub, then continue into the curve.
      for (const z of [z0, z1]) {
        for (const radius of [r0, r1]) {
          const point = world(inletX, centreY + radius, z);
          positions.push(point.x, point.y, point.z);
        }
      }
      for (let i = 0; i &lt;= segments; i += 1) {
        const angle = (i / segments) * Math.PI / 2;
        for (const z of [z0, z1]) {
          for (const radius of [r0, r1]) {
            const point = world(
              centreX - radius * Math.sin(angle),
              centreY + radius * Math.cos(angle),
              z
            );
            positions.push(point.x, point.y, point.z);
          }
        }
      }
      const stride = 4;
      const ringCount = segments + 2;
      for (let i = 0; i &lt; ringCount - 1; i += 1) {
        const q = i * stride;
        const n = (i + 1) * stride;
        indices.push(q, n, n + 2, q, n + 2, q + 2);
        indices.push(q + 1, q + 3, n + 3, q + 1, n + 3, n + 1);
        indices.push(q, q + 1, n + 1, q, n + 1, n);
        indices.push(q + 2, n + 2, n + 3, q + 2, n + 3, q + 3);
      }
      indices.push(0, 2, 3, 0, 3, 1);
      const end = (ringCount - 1) * stride;
      indices.push(end, end + 1, end + 3, end, end + 3, end + 2);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(&quot;position&quot;, new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      scene.add(new THREE.Mesh(geometry, material));
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry, 28),
        new THREE.LineBasicMaterial({
          color: theme(&quot;--foreground&quot;), transparent: true, opacity: 0.72
        })
      );
      edges.renderOrder = 7;
      scene.add(edges);
    }

    sectorSolid(bottomZ + thickness, topZ - thickness, outerRadius - thickness, outerRadius);
    sectorSolid(bottomZ + thickness, topZ - thickness, innerRadius, innerRadius + thickness);
    sectorSolid(bottomZ, bottomZ + thickness, innerRadius + thickness, outerRadius - thickness);
    sectorSolid(topZ - thickness, topZ, innerRadius + thickness, outerRadius - thickness);

    const inletOutline = [
      world(inletX, 220, bottomZ), world(inletX, 255, bottomZ),
      world(inletX, 255, bottomZ), world(inletX, 255, topZ),
      world(inletX, 255, topZ), world(inletX, 220, topZ),
      world(inletX, 220, topZ), world(inletX, 220, bottomZ)
    ];
    const outline = lineSegments(inletOutline, theme(&quot;--foreground&quot;), 0.84);
    outline.renderOrder = 8;
  }

  const rectangleProfile = { type: &quot;rectangle&quot;, halfWidth: 17.5, halfHeight: 7.5 };
  const circleProfile = radius =&gt; ({ type: &quot;circle&quot;, radius });

  function profileRadius(profile, cosine, sine) {
    if (profile.type === &quot;circle&quot;) return profile.radius;
    return Math.min(
      profile.halfWidth / Math.max(Math.abs(cosine), 1e-9),
      profile.halfHeight / Math.max(Math.abs(sine), 1e-9)
    );
  }

  function createTransition(rearY, frontY, rearProfile, frontProfile, colorToken) {
    const positions = [];
    const indices = [];
    for (let ring = 0; ring &lt; 2; ring += 1) {
      const y = ring === 0 ? rearY : frontY;
      const profile = ring === 0 ? rearProfile : frontProfile;
      for (let i = 0; i &lt; transitionSegments; i += 1) {
        const angle = (i / transitionSegments) * Math.PI * 2;
        const cosine = Math.cos(angle);
        const sine = Math.sin(angle);
        const radius = profileRadius(profile, cosine, sine);
        const point = world(
          ductCenterX + radius * cosine,
          y,
          ductCenterZ + radius * sine
        );
        positions.push(point.x, point.y, point.z);
      }
    }
    for (let i = 0; i &lt; transitionSegments; i += 1) {
      const next = (i + 1) % transitionSegments;
      const rear = i;
      const rearNext = next;
      const front = transitionSegments + i;
      const frontNext = transitionSegments + next;
      indices.push(rear, front, rearNext, rearNext, front, frontNext);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(&quot;position&quot;, new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    scene.add(new THREE.Mesh(
      geometry,
      new THREE.MeshPhongMaterial({
        color: theme(colorToken), transparent: true, opacity: 0.72,
        side: THREE.DoubleSide, depthWrite: true, shininess: 18
      })
    ));
    const outlinePoints = [];
    for (let ring = 0; ring &lt; 2; ring += 1) {
      for (let i = 0; i &lt; transitionSegments; i += 1) {
        const next = (i + 1) % transitionSegments;
        const a = (ring * transitionSegments + i) * 3;
        const b = (ring * transitionSegments + next) * 3;
        outlinePoints.push(
          new THREE.Vector3(positions[a], positions[a + 1], positions[a + 2]),
          new THREE.Vector3(positions[b], positions[b + 1], positions[b + 2])
        );
      }
    }
    for (let i = 0; i &lt; transitionSegments; i += transitionSegments / 8) {
      const rear = i * 3;
      const front = (transitionSegments + i) * 3;
      outlinePoints.push(
        new THREE.Vector3(positions[rear], positions[rear + 1], positions[rear + 2]),
        new THREE.Vector3(positions[front], positions[front + 1], positions[front + 2])
      );
    }
    const outline = lineSegments(outlinePoints, theme(&quot;--foreground&quot;), 0.9);
    outline.renderOrder = 6;
  }

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||

      pendingTrigger = null;

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
